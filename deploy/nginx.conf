worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_conn_zone $binary_remote_addr zone=demo_connections:10m;
    limit_req_zone $binary_remote_addr zone=demo_analyze:10m rate=8r/m;

    upstream datalineage_demo {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 64k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        keepalive_timeout 10s;
        send_timeout 10s;
        limit_conn demo_connections 8;

        location = /analyze {
            limit_req zone=demo_analyze burst=7 nodelay;
            proxy_request_buffering on;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://datalineage_demo;
        }

        location / {
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://datalineage_demo;
        }
    }
}
